<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Gauntlet Legends Remake</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; box-shadow: 0 0 60px rgba(255, 150, 50, 0.15); }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #webgl { background: #000; }
    #error { color: #f2c14e; font: 18px Georgia, serif; text-align: center; padding: 40px; display: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="webgl"></canvas>
    <canvas id="hud"></canvas>
  </div>
  <div id="error">This game needs WebGL. Please use a recent browser with hardware acceleration enabled.</div>
  <script>
    // always load the newest version of the game after an update (see sw.js)
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
