<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gauntlet Legends Remake</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    body { display: flex; align-items: center; justify-content: center; }
    #stage { position: relative; box-shadow: 0 0 60px rgba(255, 150, 50, 0.15); }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #webgl { background: #000; }
    #error { color: #f2c14e; font: 18px Georgia, serif; text-align: center; padding: 40px; display: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="webgl"></canvas>
    <canvas id="hud"></canvas>
  </div>
  <div id="error">This game needs WebGL. Please use a recent desktop browser with hardware acceleration enabled.</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
